groups:
  - name: rag-api
    rules:
      - alert: RagApiDown
        expr: up{job="rag-api"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: RAG API is not reachable

      - alert: RagApiHighErrorRate
        expr: |
          sum(rate(rag_errors_total[5m]))
            / clamp_min(sum(rate(rag_requests_total[5m])), 1e-9) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: More than 5% of API requests fail

      - alert: RagAskLatencyHigh
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(rag_request_latency_seconds_bucket{endpoint="/ask"}[5m]))) > 2
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: p95 latency of /ask above 2 s

  - name: rag-evaluation
    rules:
      # Threshold from RAG_EVAL_HIT_RATE_THRESHOLD (full question set; the CI gate uses its own
      # threshold for the smaller fixture set).
      - alert: RagEvalBelowThreshold
        expr: |
          rag_eval_hit_rate{variant="vector-paragraph", k="5", run="latest"}
            < on() group_left() rag_eval_hit_rate_threshold
        labels: {severity: critical}
        annotations:
          summary: "Retrieval quality below threshold: hit_rate@5 = {{ $value }}"

      - alert: RagEvalRegression
        expr: |
          rag_eval_hit_rate{k="5", run="latest"}
            < ignoring(run) rag_eval_hit_rate{k="5", run="previous"} - 0.02
        labels: {severity: warning}
        annotations:
          summary: "hit_rate@5 of {{ $labels.variant }} dropped compared to the previous evaluation"
