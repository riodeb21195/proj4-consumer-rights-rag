[project]
name = "consumer-rights-rag"
version = "0.1.0"
description = "RAG pipeline that keeps German consumer-protection law indexed and answers questions with citations."
authors = [
    { name = "riodeb21195", email = "josef.deb95@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.44.5",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "numpy>=2.5.5",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
]

[project.optional-dependencies]
# Model runtime. Installed in the Docker images and CI (Linux); PyTorch ships no wheels for
# Intel Macs any more, so the local dev venv runs without it (see docs/decisions).
ml = [
    "sentence-transformers>=6.3.0",
    "torch>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rag"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PTH", "S", "ANN"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["rag"]

[[tool.mypy.overrides]]
# Not installed in the local dev venv (no PyTorch wheels for Intel Macs), present in Docker/CI.
module = ["sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs Docker (testcontainers)",
]

[tool.coverage.run]
source = ["src/rag"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.44.5",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
    "testcontainers[minio,postgres]>=4.15.0",
    "types-lxml>=2026.2.16",
]
