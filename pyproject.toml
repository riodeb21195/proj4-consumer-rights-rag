[project]
name = "consumer-rights-rag"
version = "0.1.0"
description = "RAG pipeline that keeps German consumer-protection law indexed and answers questions with citations."
authors = [
    { name = "riodeb21195", email = "josef.deb95@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic-settings>=2.16.3",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rag"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PTH", "S", "ANN"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs Docker (testcontainers)",
]

[tool.coverage.run]
source = ["src/rag"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]
